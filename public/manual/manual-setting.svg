<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img" aria-labelledby="title desc">
  <title id="title">設定でできること</title>
  <desc id="desc">カテゴリ、割合設定、グループ、使い方マニュアルの説明図</desc>
  <rect width="800" height="540" fill="#fffaf2"/>
  <text x="64" y="72" fill="#222222" font-family="sans-serif" font-size="34" font-weight="700">設定は最初に整える場所</text>
  <text x="64" y="110" fill="#444444" font-family="sans-serif" font-size="21">使いやすくするための準備をします。</text>
  <g font-family="sans-serif">
    <rect x="74" y="160" width="300" height="118" rx="14" fill="#e9f5f8" stroke="#2f5f73" stroke-width="3"/>
    <text x="104" y="205" fill="#1f4351" font-size="26" font-weight="700">カテゴリ</text>
    <text x="104" y="240" fill="#1f4351" font-size="19">食費・日用品などを</text>
    <text x="104" y="266" fill="#1f4351" font-size="19">追加、変更、削除</text>
    <rect x="426" y="160" width="300" height="118" rx="14" fill="#f4fbf6" stroke="#2f7d60" stroke-width="3"/>
    <text x="456" y="205" fill="#24563f" font-size="26" font-weight="700">割合設定</text>
    <text x="456" y="240" fill="#24563f" font-size="19">誰が何％負担するか</text>
    <text x="456" y="266" fill="#24563f" font-size="19">合計は100％</text>
    <rect x="74" y="318" width="300" height="118" rx="14" fill="#fff1df" stroke="#b7691b" stroke-width="3"/>
    <text x="104" y="363" fill="#70410f" font-size="26" font-weight="700">グループ</text>
    <text x="104" y="398" fill="#70410f" font-size="19">名前の変更</text>
    <text x="104" y="424" fill="#70410f" font-size="19">招待リンクの作成</text>
    <rect x="426" y="318" width="300" height="118" rx="14" fill="#f6f0ff" stroke="#7661a6" stroke-width="3"/>
    <text x="456" y="363" fill="#4f3f78" font-size="26" font-weight="700">マニュアル</text>
    <text x="456" y="398" fill="#4f3f78" font-size="19">操作に迷ったときに</text>
    <text x="456" y="424" fill="#4f3f78" font-size="19">このページを見る</text>
  </g>
  <text x="96" y="506" fill="#6b4f2a" font-family="sans-serif" font-size="22" font-weight="700">設定を整えると、毎日の入力が簡単になります。</text>
</svg>
