<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img" aria-labelledby="title desc">
  <title id="title">予測の使い分け</title>
  <desc id="desc">1ヶ月予測、3ヶ月予測、6ヶ月予測を選び、収入と支出を入力する説明図</desc>
  <rect width="800" height="540" fill="#fffaf2"/>
  <text x="64" y="72" fill="#222222" font-family="sans-serif" font-size="34" font-weight="700">予測は目的で選ぶ</text>
  <text x="64" y="110" fill="#444444" font-family="sans-serif" font-size="21">今月だけ見るか、先の月まで見るかを選びます。</text>
  <g font-family="sans-serif">
    <rect x="64" y="150" width="206" height="90" rx="14" fill="#e9f5f8" stroke="#2f5f73" stroke-width="3"/>
    <text x="92" y="190" fill="#1f4351" font-size="22" font-weight="700">1ヶ月予測</text>
    <text x="92" y="220" fill="#1f4351" font-size="18">今月分を見る</text>
    <rect x="297" y="150" width="206" height="90" rx="14" fill="#f4fbf6" stroke="#2f7d60" stroke-width="3"/>
    <text x="336" y="190" fill="#24563f" font-size="22" font-weight="700">3ヶ月予測</text>
    <text x="336" y="220" fill="#24563f" font-size="18">近い予定を見る</text>
    <rect x="530" y="150" width="206" height="90" rx="14" fill="#fff1df" stroke="#b7691b" stroke-width="3"/>
    <text x="569" y="190" fill="#70410f" font-size="22" font-weight="700">6ヶ月予測</text>
    <text x="569" y="220" fill="#70410f" font-size="18">長めに見る</text>
  </g>
  <path d="M400 258 L400 300" stroke="#555555" stroke-width="5" stroke-linecap="round"/>
  <path d="M386 288 L400 306 L414 288" fill="none" stroke="#555555" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="94" y="322" width="612" height="102" rx="14" fill="#ffffff" stroke="#ded2c2" stroke-width="3"/>
  <g font-family="sans-serif" font-size="23" font-weight="700">
    <text x="128" y="365" fill="#222222">収入</text>
    <text x="304" y="365" fill="#222222">固定費</text>
    <text x="498" y="365" fill="#222222">変動費</text>
  </g>
  <g stroke="#9aa8ad" stroke-width="2">
    <line x1="248" y1="340" x2="248" y2="406"/>
    <line x1="448" y1="340" x2="448" y2="406"/>
  </g>
  <text x="128" y="397" fill="#555555" font-family="sans-serif" font-size="18">給料など</text>
  <text x="304" y="397" fill="#555555" font-family="sans-serif" font-size="18">家賃など</text>
  <text x="498" y="397" fill="#555555" font-family="sans-serif" font-size="18">食費など</text>
  <rect x="292" y="454" width="216" height="54" rx="12" fill="#2f5f73"/>
  <text x="365" y="489" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="700">保存</text>
</svg>
