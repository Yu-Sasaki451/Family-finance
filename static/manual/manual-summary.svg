<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img" aria-labelledby="title desc">
  <title id="title">集計を見る手順</title>
  <desc id="desc">月を選んでカテゴリ合計と精算を確認する説明図</desc>
  <rect width="800" height="540" fill="#fffaf2"/>
  <text x="64" y="72" fill="#222222" font-family="sans-serif" font-size="34" font-weight="700">集計は月を選んで確認</text>
  <text x="64" y="110" fill="#444444" font-family="sans-serif" font-size="21">合計、カテゴリ、精算の目安を見ます。</text>
  <rect x="64" y="148" width="672" height="314" rx="14" fill="#ffffff" stroke="#ded2c2" stroke-width="3"/>
  <rect x="98" y="184" width="246" height="54" rx="10" fill="#e9f5f8" stroke="#2f5f73" stroke-width="3"/>
  <text x="124" y="219" fill="#1f4351" font-family="sans-serif" font-size="23" font-weight="700">2026年7月を選ぶ</text>
  <path d="M221 246 L221 278" stroke="#2f5f73" stroke-width="5" stroke-linecap="round"/>
  <path d="M209 267 L221 283 L233 267" fill="none" stroke="#2f5f73" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="sans-serif">
    <rect x="98" y="294" width="190" height="112" rx="12" fill="#f4fbf6" stroke="#2f7d60" stroke-width="3"/>
    <text x="124" y="330" fill="#24563f" font-size="23" font-weight="700">カテゴリ合計</text>
    <text x="124" y="365" fill="#24563f" font-size="19">食費 28,000円</text>
    <text x="124" y="393" fill="#24563f" font-size="19">日用品 9,000円</text>
    <rect x="306" y="294" width="190" height="112" rx="12" fill="#fff1df" stroke="#b7691b" stroke-width="3"/>
    <text x="332" y="330" fill="#70410f" font-size="23" font-weight="700">精算</text>
    <text x="332" y="365" fill="#70410f" font-size="19">誰が誰へ</text>
    <text x="332" y="393" fill="#70410f" font-size="19">いくら払うか</text>
    <rect x="514" y="294" width="176" height="112" rx="12" fill="#f6f0ff" stroke="#7661a6" stroke-width="3"/>
    <text x="540" y="330" fill="#4f3f78" font-size="23" font-weight="700">明細</text>
    <text x="540" y="365" fill="#4f3f78" font-size="19">変更</text>
    <text x="540" y="393" fill="#4f3f78" font-size="19">削除</text>
  </g>
  <text x="96" y="507" fill="#6b4f2a" font-family="sans-serif" font-size="22" font-weight="700">明細の削除は元に戻せないので、確認してから押します。</text>
</svg>
