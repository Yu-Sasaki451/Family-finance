<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img" aria-labelledby="title desc">
  <title id="title">メニューから機能を選ぶ説明図</title>
  <desc id="desc">上のメニューから支出登録、集計、予測、設定を選ぶ流れ</desc>
  <rect width="800" height="540" fill="#fffaf2"/>
  <rect x="48" y="44" width="704" height="76" rx="12" fill="#2f5f73"/>
  <text x="78" y="93" fill="#ffffff" font-family="sans-serif" font-size="30" font-weight="700">家計簿</text>
  <rect x="222" y="62" width="116" height="40" rx="8" fill="#ffffff"/>
  <rect x="350" y="62" width="92" height="40" rx="8" fill="#ffffff"/>
  <rect x="454" y="62" width="126" height="40" rx="8" fill="#ffffff"/>
  <rect x="592" y="62" width="92" height="40" rx="8" fill="#ffffff"/>
  <text x="244" y="88" fill="#1f4351" font-family="sans-serif" font-size="18" font-weight="700">支出登録</text>
  <text x="378" y="88" fill="#1f4351" font-family="sans-serif" font-size="18" font-weight="700">集計</text>
  <text x="498" y="88" fill="#1f4351" font-family="sans-serif" font-size="18" font-weight="700">予測</text>
  <text x="620" y="88" fill="#1f4351" font-family="sans-serif" font-size="18" font-weight="700">設定</text>
  <text x="74" y="174" fill="#222222" font-family="sans-serif" font-size="34" font-weight="700">まずは上のメニューを見ます</text>
  <text x="74" y="215" fill="#444444" font-family="sans-serif" font-size="22">やりたいことに合わせて、押す場所を選びます。</text>
  <g font-family="sans-serif" font-size="24" font-weight="700">
    <rect x="78" y="270" width="286" height="70" rx="12" fill="#e9f5f8" stroke="#2f5f73" stroke-width="3"/>
    <text x="112" y="313" fill="#1f4351">お金を使った</text>
    <text x="294" y="313" fill="#1f4351">支出登録</text>
    <path d="M246 304 L276 304" stroke="#1f4351" stroke-width="4" stroke-linecap="round"/>
    <path d="M268 294 L282 304 L268 314" fill="none" stroke="#1f4351" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="436" y="270" width="286" height="70" rx="12" fill="#f4fbf6" stroke="#2f7d60" stroke-width="3"/>
    <text x="470" y="313" fill="#24563f">合計を見る</text>
    <text x="642" y="313" fill="#24563f">集計</text>
    <path d="M604 304 L632 304" stroke="#24563f" stroke-width="4" stroke-linecap="round"/>
    <path d="M624 294 L638 304 L624 314" fill="none" stroke="#24563f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="78" y="374" width="286" height="70" rx="12" fill="#fff1df" stroke="#b7691b" stroke-width="3"/>
    <text x="112" y="417" fill="#70410f">先を見る</text>
    <text x="292" y="417" fill="#70410f">予測</text>
    <path d="M224 408 L272 408" stroke="#70410f" stroke-width="4" stroke-linecap="round"/>
    <path d="M264 398 L278 408 L264 418" fill="none" stroke="#70410f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="436" y="374" width="286" height="70" rx="12" fill="#f6f0ff" stroke="#7661a6" stroke-width="3"/>
    <text x="470" y="417" fill="#4f3f78">準備をする</text>
    <text x="642" y="417" fill="#4f3f78">設定</text>
    <path d="M604 408 L632 408" stroke="#4f3f78" stroke-width="4" stroke-linecap="round"/>
    <path d="M624 398 L638 408 L624 418" fill="none" stroke="#4f3f78" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
