<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img" aria-labelledby="title desc">
  <title id="title">支出登録の入力手順</title>
  <desc id="desc">支払日、支払った人、カテゴリ、合計金額、個人分、登録ボタンの順に入力する説明図</desc>
  <rect width="800" height="540" fill="#fffaf2"/>
  <text x="64" y="72" fill="#222222" font-family="sans-serif" font-size="34" font-weight="700">支出登録は上から順に入力</text>
  <text x="64" y="110" fill="#444444" font-family="sans-serif" font-size="21">迷ったときは、日付から順番に入れてください。</text>
  <rect x="64" y="146" width="672" height="318" rx="14" fill="#ffffff" stroke="#ded2c2" stroke-width="3"/>
  <g font-family="sans-serif" font-size="22">
    <text x="98" y="199" fill="#222222" font-weight="700">1 支払日</text>
    <rect x="268" y="174" width="226" height="42" rx="8" fill="#f4f7f8" stroke="#99aeb6" stroke-width="2"/>
    <text x="292" y="203" fill="#46545a">2026-07-26</text>
    <text x="98" y="259" fill="#222222" font-weight="700">2 支払った人</text>
    <rect x="268" y="234" width="226" height="42" rx="8" fill="#f4f7f8" stroke="#99aeb6" stroke-width="2"/>
    <text x="292" y="263" fill="#46545a">名前を選ぶ</text>
    <text x="98" y="319" fill="#222222" font-weight="700">3 カテゴリ</text>
    <rect x="268" y="294" width="226" height="42" rx="8" fill="#f4f7f8" stroke="#99aeb6" stroke-width="2"/>
    <text x="292" y="323" fill="#46545a">食費など</text>
    <text x="98" y="379" fill="#222222" font-weight="700">4 合計金額</text>
    <rect x="268" y="354" width="226" height="42" rx="8" fill="#f4f7f8" stroke="#99aeb6" stroke-width="2"/>
    <text x="292" y="383" fill="#46545a">3,000 円</text>
  </g>
  <rect x="532" y="174" width="156" height="108" rx="12" fill="#f4fbf6" stroke="#2f7d60" stroke-width="3"/>
  <text x="558" y="214" fill="#24563f" font-family="sans-serif" font-size="22" font-weight="700">個人分</text>
  <text x="558" y="247" fill="#24563f" font-family="sans-serif" font-size="18">自分だけの分を</text>
  <text x="558" y="273" fill="#24563f" font-family="sans-serif" font-size="18">ここに入力</text>
  <rect x="532" y="330" width="156" height="66" rx="12" fill="#2f5f73"/>
  <text x="584" y="372" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="700">登録</text>
  <path d="M610 286 L610 318" stroke="#2f5f73" stroke-width="5" stroke-linecap="round"/>
  <path d="M598 307 L610 323 L622 307" fill="none" stroke="#2f5f73" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="96" y="507" fill="#6b4f2a" font-family="sans-serif" font-size="22" font-weight="700">登録すると、その月の集計画面へ移動します。</text>
</svg>
